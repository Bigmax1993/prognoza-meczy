# Poniedziałek 02:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 03:00.
# GitHub Actions cron jest zawsze w UTC.
name: Wysyłka Gmail poniedziałek

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz Excel z niedzielnego pipeline
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=pipeline.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Brak udanego runu pipeline.yml"
            exit 1
          fi
          echo "pipeline run_id=$RUN_ID"
          # predykcje_2026.xlsx jest w repo — gh run download nie nadpisuje (file exists).
          rm -f predykcje_2026.xlsx
          mkdir -p artifacts
          gh run download "$RUN_ID" --name predykcje-xlsx --dir artifacts
          cp artifacts/predykcje_2026.xlsx predykcje_2026.xlsx
          test -f predykcje_2026.xlsx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wyślij mail
        run: python send_mail.py --plik predykcje_2026.xlsx
