# Poniedziałek 01:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 02:00.
# GitHub Actions cron jest zawsze w UTC (niedziela 23:00 UTC = poniedziałek 01:00 CEST).
#
# Część 2: bierze predykcje-partial z niedzielnego discovery i dokańcza fill (max 4 h).
name: Pipeline poniedziałek fill

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PYTHONIOENCODING: utf-8
  FILL_BUDGET_MINUTES: "210"

jobs:
  fill:
    name: Część 2 — dokończ fill
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cache/missing_data.json
          key: missing-data-${{ github.run_id }}-2
          restore-keys: |
            missing-data-
          save-always: true
      - name: Pobierz artifact z niedzielnego discovery
        run: |
          set -euo pipefail
          mkdir -p artifacts cache partial
          RUN_ID=$(gh run list --workflow=pipeline.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Brak udanego runu pipeline.yml (discovery)"
            exit 1
          fi
          echo "discovery run_id=$RUN_ID"
          gh run download "$RUN_ID" --name predykcje-partial --dir partial
          cp partial/predykcje_2026.xlsx artifacts/previous_predykcje_2026.xlsx
          rm -f predykcje_2026.xlsx
          cp partial/predykcje_2026.xlsx predykcje_2026.xlsx
          if [ -f partial/cache/missing_data.json ]; then
            cp partial/cache/missing_data.json cache/missing_data.json
          elif [ -f partial/missing_data.json ]; then
            cp partial/missing_data.json cache/missing_data.json
          fi
          ls -la artifacts cache partial
          test -f cache/missing_data.json
          test -f predykcje_2026.xlsx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Zależności
        run: pip install -r requirements.txt
      - name: Uruchom fill (część 2)
        run: |
          python predykcje.py --fill-missing \
            --fill-budget-minutes "${FILL_BUDGET_MINUTES}" \
            --restore-excel artifacts/previous_predykcje_2026.xlsx
      - name: Artifact Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx
          path: predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7
