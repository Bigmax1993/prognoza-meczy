# Niedziela 20:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 21:00.
# GitHub Actions cron jest zawsze w UTC.
name: Pipeline niedziela

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  predykcje:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cache/missing_data.json
          key: missing-data-${{ github.run_id }}
          restore-keys: |
            missing-data-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Zależności
        run: pip install -r requirements.txt
      - name: Pobierz poprzednie Excel z artifactów
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CURRENT="${{ github.run_id }}"
          for RUN_ID in $(gh run list --workflow=pipeline.yml --status=success --limit 6 --json databaseId --jq '.[].databaseId'); do
            if [ "$RUN_ID" = "$CURRENT" ]; then
              continue
            fi
            DEST="artifacts/run-${RUN_ID}"
            mkdir -p "$DEST"
            if gh run download "$RUN_ID" --name predykcje-xlsx --dir "$DEST" 2>/dev/null; then
              cp "$DEST/predykcje_2026.xlsx" "artifacts/predykcje_prev_${RUN_ID}.xlsx"
              if [ ! -f artifacts/previous_predykcje_2026.xlsx ]; then
                cp "$DEST/predykcje_2026.xlsx" artifacts/previous_predykcje_2026.xlsx
              fi
              echo "artifact run_id=$RUN_ID"
            fi
          done
          ls -la artifacts || true
      - name: Uruchom pipeline
        run: python predykcje.py --fill-missing
      - name: Artifact Excel
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-xlsx
          path: predykcje_2026.xlsx
          if-no-files-found: error
          retention-days: 7
