# Niedziela 20:00 czasu polskiego (CEST = UTC+2). Zimą (CET) będzie 21:00.
# GitHub Actions cron jest zawsze w UTC.
#
# Część 1 (discovery): soft-stop przed limitem 4 h → artifact predykcje-partial.
# Część 2 (pipeline-czesc2.yml) startuje w poniedziałek 01:00 i dokańcza fill.
name: Pipeline niedziela discovery

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  PYTHONIOENCODING: utf-8
  # ~3.5 h pracy fill + zapas na setup, żeby GitHub nie ubił joba na 4h0m
  FILL_BUDGET_MINUTES: "210"

jobs:
  discovery:
    name: Część 1 — discovery + fill
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cache/missing_data.json
          key: missing-data-${{ github.run_id }}-1
          restore-keys: |
            missing-data-
          save-always: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Zależności
        run: pip install -r requirements.txt
      - name: Pobierz poprzednie Excel z artifactów
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CURRENT="${{ github.run_id }}"
          for RUN_ID in $(gh run list --workflow=pipeline-czesc2.yml --status=success --limit 6 --json databaseId --jq '.[].databaseId'); do
            if [ "$RUN_ID" = "$CURRENT" ]; then
              continue
            fi
            DEST="artifacts/run-${RUN_ID}"
            mkdir -p "$DEST"
            if gh run download "$RUN_ID" --name predykcje-xlsx --dir "$DEST" 2>/dev/null; then
              cp "$DEST/predykcje_2026.xlsx" "artifacts/predykcje_prev_${RUN_ID}.xlsx"
              if [ ! -f artifacts/previous_predykcje_2026.xlsx ]; then
                cp "$DEST/predykcje_2026.xlsx" artifacts/previous_predykcje_2026.xlsx
              fi
              echo "artifact run_id=$RUN_ID"
            fi
          done
          ls -la artifacts || true
      - name: Uruchom discovery (część 1)
        run: |
          python predykcje.py --fill-missing \
            --fill-budget-minutes "${FILL_BUDGET_MINUTES}" \
            --allow-incomplete
      - name: Artifact część 1
        uses: actions/upload-artifact@v4
        with:
          name: predykcje-partial
          path: |
            predykcje_2026.xlsx
            cache/missing_data.json
          if-no-files-found: error
          retention-days: 3
