name: Testy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Zależności
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest tests -q --tb=short
